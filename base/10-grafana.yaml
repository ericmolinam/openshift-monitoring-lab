apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: "grafana"  # Label used by datasources/dashboards to find this instance
spec:
  route:
    spec: {}  # Empty spec = use defaults. Operator auto-creates OpenShift Route
  config:
    log:
      mode: "console"
    auth:
      disable_login_form: "false"
    security:
      admin_user: admin
      admin_password: grafana