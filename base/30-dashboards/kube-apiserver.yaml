apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kube-apiserver
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "Cluster"
  json: |
    {
      "title": "Kubernetes API Server",
      "uid": "kube-apiserver",
      "tags": ["kubernetes", "apiserver", "openshift"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-3h", "to": "now" },
      "schemaVersion": 30,
      "panels": [
        {
          "id": 1,
          "title": "Request Rate by Verb",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "expr": "sum(rate(apiserver_request_total[5m])) by (verb)",
            "legendFormat": "{{verb}}"
          }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "title": "Error Rate (4xx / 5xx)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [
            {
              "expr": "sum(rate(apiserver_request_total{code=~\"4..\"}[5m])) by (code)",
              "legendFormat": "{{code}} client errors"
            },
            {
              "expr": "sum(rate(apiserver_request_total{code=~\"5..\"}[5m])) by (code)",
              "legendFormat": "{{code}} server errors"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 3,
          "title": "Request Latency p99 by Verb",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(apiserver_request_duration_seconds_bucket{subresource!=\"log\"}[5m])) by (verb, le))",
            "legendFormat": "p99 {{verb}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 4,
          "title": "In-Flight Requests",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "expr": "apiserver_current_inflight_requests",
            "legendFormat": "{{request_kind}}"
          }]
        },
        {
          "id": 5,
          "title": "Admission Webhook Latency p99",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 24, "h": 8 },
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(apiserver_admission_webhook_admission_duration_seconds_bucket[5m])) by (name, le))",
            "legendFormat": "{{name}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        }
      ]
    }