apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-overview
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "Cluster"
  json: |
    {
      "title": "Cluster Overview",
      "uid": "cluster-overview",
      "tags": ["openshift", "overview"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "schemaVersion": 30,
      "panels": [
        {
          "id": 1,
          "title": "etcd Leader",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "min(etcd_server_has_leader)", "legendFormat": "" }],
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "text": "No Leader", "color": "red" }, "1": { "text": "OK", "color": "green" } } }]
            }
          }
        },
        {
          "id": 2,
          "title": "API Server Errors",
          "type": "stat",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(rate(apiserver_request_total{code=~\"5..\"}[5m]))", "legendFormat": "" }],
          "fieldConfig": { "defaults": { "unit": "reqps", "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 0.1 }] } } }
        },
        {
          "id": 3,
          "title": "Pending Pods",
          "type": "stat",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "sum(kube_pod_status_phase{phase=\"Pending\"})", "legendFormat": "" }],
          "fieldConfig": { "defaults": { "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 10 }] } } }
        },
        {
          "id": 4,
          "title": "Node Count",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 4, "h": 4 },
          "targets": [{ "expr": "count(kube_node_info)", "legendFormat": "" }]
        },
        {
          "id": 5,
          "title": "API Request Rate",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "sum(rate(apiserver_request_total[5m])) by (verb)", "legendFormat": "{{verb}}" }],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 6,
          "title": "etcd WAL Fsync p99",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{ "expr": "histogram_quantile(0.99, sum(rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])) by (instance, le))", "legendFormat": "{{instance}}" }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },
        {
          "id": 7,
          "title": "Node CPU Usage %",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "{{node}}" }],
          "fieldConfig": { "defaults": { "unit": "percent" } }
        },
        {
          "id": 8,
          "title": "Node Memory Available",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{ "expr": "node_memory_MemAvailable_bytes", "legendFormat": "{{node}}" }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        }
      ]
    }