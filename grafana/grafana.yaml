apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: "grafana"  # Label used by datasources/dashboards to find this instance
spec:
  route:
    spec:
      port:
        targetPort: proxy          # Route forwards to oauth-proxy, not directly to Grafana
      tls:
        termination: Reencrypt     # Proxy serves TLS; OCP re-encrypts to the backend
        insecureEdgeTerminationPolicy: Redirect
  service:
    metadata:
      annotations:
        # Triggers OpenShift to auto-generate a serving TLS cert as secret grafana-tls
        service.beta.openshift.io/serving-cert-secret-name: grafana-tls
  config:
    log:
      mode: "console"
    auth:
      disable_login_form: "true"   # Native login disabled; oauth-proxy handles authentication
    auth.proxy:
      enabled: "true"
      header_name: X-Forwarded-User
      header_property: username
      auto_sign_up: "true"         # Auto-provision Grafana user on first OAuth login
    security:
      admin_user: admin
      admin_password: grafana
  deployment:
    spec:
      template:
        spec:
          serviceAccountName: grafana-sa  # SA with oauth-redirectreference annotation
          volumes:
            - name: grafana-tls
              secret:
                secretName: grafana-tls              # Serving cert generated by OpenShift
            - name: grafana-proxy-session-secret
              secret:
                secretName: grafana-proxy-session-secret
          containers:
            - name: grafana-proxy
              image: quay.io/openshift/origin-oauth-proxy:4.14
              ports:
                - name: proxy
                  containerPort: 9091
              args:
                - --provider=openshift
                - --https-address=:9091
                - --http-address=
                - --upstream=http://localhost:3000
                - --tls-cert=/etc/tls/private/tls.crt
                - --tls-key=/etc/tls/private/tls.key
                - --cookie-secret-file=/etc/proxy/secrets/session_secret
                - --openshift-service-account=grafana-sa
                - --openshift-ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                - --skip-auth-regex=^/metrics
              volumeMounts:
                - mountPath: /etc/tls/private
                  name: grafana-tls
                - mountPath: /etc/proxy/secrets
                  name: grafana-proxy-session-secret
